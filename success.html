<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>购买成功 · 小红书 AI 加速器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          brand: { 50:'#fff1f0', 100:'#ffdedb', 500:'#e63946', 600:'#c1121f', 900:'#780000' },
          ink:   { 900:'#1a1a1a', 700:'#3d3d3d', 500:'#737373', 300:'#d4d4d4', 100:'#f5f5f5' }
        }
      }}
    }
  </script>
</head>
<body class="bg-white text-ink-900 font-sans antialiased">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-ink-100">
    <nav class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-7 h-7 rounded-md bg-brand-500 text-white grid place-items-center font-bold">小</span>
        <span class="font-semibold">小红书 AI 加速器</span>
      </a>
      <ul class="hidden md:flex items-center gap-6 text-sm text-ink-700">
        <li><a href="tools.html"   class="hover:text-brand-500">AI 工具</a></li>
        <li><a href="methods.html" class="hover:text-brand-500">方法论</a></li>
        <li><a href="pricing.html" class="hover:text-brand-500">定价</a></li>
        <li class="text-ink-500">积分：<span id="nav-points" class="text-brand-500 font-semibold">10</span></li>
      </ul>
    </nav>
  </header>

  <main class="max-w-xl mx-auto px-4 py-20 text-center">
    <div class="w-16 h-16 mx-auto rounded-full bg-brand-50 text-brand-500 grid place-items-center text-3xl mb-6">✓</div>
    <h1 class="text-3xl font-bold mb-2">购买成功！</h1>
    <p class="text-ink-500 mb-2" id="success-msg">你的积分已到账，开始创作吧～</p>
    <p class="text-sm text-ink-500 mb-8">当前积分：<span id="success-points" class="text-brand-500 font-semibold text-base">10</span></p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="tools.html" class="px-6 py-3 rounded-md bg-brand-500 text-white hover:bg-brand-600">立即使用 AI 工具</a>
      <a href="methods.html" class="px-6 py-3 rounded-md border border-ink-300 hover:border-brand-500 hover:text-brand-500">看方法论</a>
    </div>
  </main>

  <footer class="border-t border-ink-100 py-8 text-center text-xs text-ink-500">
    <p>© 2026 小红书 AI 加速器</p>
  </footer>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      App.track('page_view', { page: 'success' });
      App.refreshPointsBadge();

      // 从 URL 读取套餐，给用户更具体的反馈
      const params = new URLSearchParams(location.search);
      const pkg = params.get('package');
      const map = {
        trial_3.9:   { add: 10,  label: '体验包（3.9 元 / 10 积分）' },
        monthly_9.9: { add: 100, label: '月卡（9.9 元 / 100 积分）'  },
      };
      if (pkg && map[pkg]) {
        App.addPoints(map[pkg].add);
        App.track('purchase_complete', { package: pkg });
        document.getElementById('success-msg').textContent =
          `已开通：${map[pkg].label}，积分已到账。`;
      }
      document.getElementById('success-points').textContent = App.getPoints();
      App.refreshPointsBadge();
    });
  </script>
</body>
</html>
