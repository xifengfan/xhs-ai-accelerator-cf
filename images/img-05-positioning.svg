<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#f5f3ee"/>
  <rect x="0" y="0" width="800" height="80" fill="#e63946"/>
  <text x="60" y="55" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="6">05 / POSITION</text>
  <text x="740" y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="end" letter-spacing="2">METHODS</text>

  <text x="60" y="180" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#1a1a1a" letter-spacing="-2">账号</text>
  <text x="60" y="260" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#e63946" letter-spacing="-2">定位 5 步</text>
  <line x1="60" y1="300" x2="320" y2="300" stroke="#1a1a1a" stroke-width="3"/>
  <text x="60" y="340" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1a1a1a" letter-spacing="2">罗盘思维 · 找到你的北方</text>

  <!-- 中央罗盘/雷达图 -->
  <g transform="translate(400, 560)">
    <!-- 五层五边形 -->
    <polygon points="0,-160 152,-49 94,129 -94,129 -152,-49" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    <polygon points="0,-120 114,-37 71,97 -71,97 -114,-37" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    <polygon points="0,-80 76,-25 47,65 -47,65 -76,-25" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
    <polygon points="0,-40 38,-12 24,32 -24,32 -38,-12" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>

    <!-- 轴线 -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="152" y2="-49" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="94" y2="129" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="-94" y2="129" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="-152" y2="-49" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>

    <!-- 数据多边形（朱砂红填充）-->
    <polygon points="0,-130 110,-35 65,90 -50,70 -120,-39" fill="#e63946" fill-opacity="0.85" stroke="#e63946" stroke-width="2"/>
    <circle cx="0" cy="-130" r="5" fill="#1a1a1a"/>
    <circle cx="110" cy="-35" r="5" fill="#1a1a1a"/>
    <circle cx="65" cy="90" r="5" fill="#1a1a1a"/>
    <circle cx="-50" cy="70" r="5" fill="#1a1a1a"/>
    <circle cx="-120" cy="-39" r="5" fill="#1a1a1a"/>

    <!-- 5 个轴标签 -->
    <text x="0" y="-180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">领域</text>
    <text x="180" y="-55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">人群</text>
    <text x="115" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">痛点</text>
    <text x="-115" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="end">风格</text>
    <text x="-180" y="-55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="end">变现</text>
  </g>

  <!-- 5 步说明 -->
  <g transform="translate(60, 820)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" letter-spacing="3">FIVE DIMENSIONS</text>
    <text x="0" y="35" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">领域  ·  人群  ·  痛点  ·  风格  ·  变现</text>
    <text x="0" y="65" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1a1a1a">五个维度，定位你的账号坐标系</text>
  </g>

  <text x="60" y="960" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a1a1a" letter-spacing="3">XHS · METHOD 05 / 08</text>
  <text x="740" y="960" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1a1a1a" text-anchor="end" letter-spacing="3">范家读本</text>
</svg>
